openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        "200":
          description: La aplicación está disponible
          content:
            text/html:
              schema:
                type: string
                example: Hello World!
      tags:
        - app
  /items:
    post:
      operationId: ItemsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemDto"
      responses:
        "201":
          description: Item creado con éxito
        "400":
          description: Datos de entrada inválidos
        "409":
          description: Ya existe un item con ese nombre
      summary: Crear un nuevo item
      tags: &a1
        - items
    get:
      description: Permite buscar por nombre usando el parámetro q (coincidencia
        parcial, sin distinguir mayúsculas) y paginar con page/limit.
      operationId: ItemsController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Página (desde 1)
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Resultados por página (máximo 100)
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: q
          required: false
          in: query
          description: Texto para buscar items por nombre (coincidencia parcial, sin
            distinguir mayúsculas)
          schema:
            example: tomate
            type: string
      responses:
        "200":
          description: Lista paginada de items obtenida con éxito
      summary: Obtener la lista de items
      tags: *a1
  /items/{id}:
    get:
      operationId: ItemsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          description: ID único del item (ObjectId)
          schema:
            type: string
      responses:
        "200":
          description: Item obtenido con éxito
        "404":
          description: Item no encontrado
      summary: Obtener un item por su ID
      tags: *a1
    patch:
      operationId: ItemsController_update
      parameters:
        - name: id
          required: true
          in: path
          description: ID único del item (ObjectId)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemDto"
      responses:
        "200":
          description: Item actualizado con éxito
        "400":
          description: Datos de entrada inválidos
        "404":
          description: Item no encontrado
        "409":
          description: Ya existe un item con ese nombre
      summary: Actualizar un item
      tags: *a1
    delete:
      description: "Baja lógica: el item se marca como inactivo y deja de aparecer en
        el listado."
      operationId: ItemsController_remove
      parameters:
        - name: id
          required: true
          in: path
          description: ID único del item (ObjectId)
          schema:
            type: string
      responses:
        "200":
          description: Item desactivado con éxito
        "404":
          description: Item no encontrado
      summary: Desactivar un item
      tags: *a1
  /suppliers:
    post:
      operationId: SuppliersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplierDto"
      responses:
        "201":
          description: Proveedor creado con éxito
        "400":
          description: Datos de entrada inválidos
        "409":
          description: Ya existe un proveedor con ese nombre
      summary: Crear un nuevo proveedor
      tags: &a2
        - suppliers
    get:
      description: Devuelve los proveedores activos paginados. Con
        includeInactive=true incluye también los dados de baja.
      operationId: SuppliersController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Página (desde 1)
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Resultados por página (máximo 100)
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: includeInactive
          required: false
          in: query
          description: Incluir también los proveedores dados de baja (por defecto solo
            activos)
          schema:
            example: false
            type: boolean
      responses:
        "200":
          description: Lista paginada de proveedores obtenida con éxito
      summary: Obtener la lista de proveedores
      tags: *a2
  /suppliers/{id}:
    get:
      operationId: SuppliersController_findOne
      parameters:
        - name: id
          required: true
          in: path
          description: ID único del proveedor (ObjectId)
          schema:
            type: string
      responses:
        "200":
          description: Proveedor obtenido con éxito
        "404":
          description: Proveedor no encontrado
      summary: Obtener un proveedor por su ID
      tags: *a2
    patch:
      operationId: SuppliersController_update
      parameters:
        - name: id
          required: true
          in: path
          description: ID único del proveedor
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplierDto"
      responses:
        "200":
          description: Proveedor actualizado con éxito
        "404":
          description: Proveedor no encontrado
      summary: Actualizar un proveedor
      tags: *a2
    delete:
      operationId: SuppliersController_remove
      parameters:
        - name: id
          required: true
          in: path
          description: ID único del proveedor
          schema:
            type: string
      responses:
        "200":
          description: Proveedor eliminado con éxito
        "404":
          description: Proveedor no encontrado
      summary: Eliminar un proveedor
      tags: *a2
  /batches:
    post:
      operationId: BatchController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchDto"
      responses:
        "201":
          description: Lote creado con éxito
        "400":
          description: Datos de entrada inválidos
        "404":
          description: Item referenciado no encontrado
        "409":
          description: Ya existe un lote con ese número
      summary: Crear un nuevo lote
      tags: &a3
        - batches
    get:
      operationId: BatchController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Página (desde 1)
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Resultados por página (máximo 100)
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: itemId
          required: false
          in: query
          description: Filtrar lotes por ID de item (ObjectId)
          schema:
            type: string
      responses:
        "200":
          description: Lista paginada de lotes obtenida con éxito
      summary: Obtener la lista paginada de lotes
      tags: *a3
  /batches/{id}:
    get:
      operationId: BatchController_findOne
      parameters:
        - name: id
          required: true
          in: path
          description: ID único del lote (ObjectId)
          schema:
            type: string
      responses:
        "200":
          description: Lote obtenido con éxito
        "404":
          description: Lote no encontrado
      summary: Obtener un lote por su ID
      tags: *a3
    patch:
      operationId: BatchController_update
      parameters:
        - name: id
          required: true
          in: path
          description: ID único del lote
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBatchDto"
      responses:
        "200":
          description: Lote actualizado con éxito
        "404":
          description: Lote no encontrado
      summary: Actualizar un lote
      tags: *a3
    delete:
      operationId: BatchController_remove
      parameters:
        - name: id
          required: true
          in: path
          description: ID único del lote
          schema:
            type: string
      responses:
        "200":
          description: Lote eliminado con éxito
        "404":
          description: Lote no encontrado
      summary: Eliminar un lote
      tags: *a3
  /suppliers/{id}/cost-history:
    get:
      description: Lista las compras (lotes) del proveedor con su costo unitario de
        compra, la más reciente primero. Admite filtros por insumo y rango de
        fechas, orden y paginación.
      operationId: SupplierCostHistoryController_findCostHistory
      parameters:
        - name: id
          required: true
          in: path
          description: ID del proveedor (ObjectId)
          schema:
            type: string
        - name: itemId
          required: false
          in: query
          description: Filtrar por ID de item (ObjectId)
          schema:
            type: string
        - name: from
          required: false
          in: query
          description: Fecha inicial de la compra (ISO 8601; con solo fecha incluye todo
            ese día)
          schema:
            example: 2026-11-01
            type: string
        - name: to
          required: false
          in: query
          description: Fecha final de la compra (ISO 8601; con solo fecha incluye todo ese
            día)
          schema:
            example: 2026-11-30
            type: string
        - name: order
          required: false
          in: query
          description: "Orden por fecha de compra: desc (más reciente primero) o asc"
          schema:
            default: desc
            type: string
            enum:
              - desc
              - asc
        - name: page
          required: false
          in: query
          description: Página (desde 1)
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Resultados por página (máximo 100)
          schema:
            default: 20
            type: number
      responses:
        "200":
          description: Historial obtenido con éxito
        "404":
          description: Proveedor no encontrado
      summary: Historial de costos de compra de un proveedor
      tags:
        - suppliers
  /movements:
    get:
      description: "Los movimientos son de solo lectura: no se editan ni eliminan; las
        correcciones se hacen con movimientos compensatorios. Soporta paginación
        con page/limit."
      operationId: StockMovementController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Página (desde 1)
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Resultados por página (máximo 100)
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: batchId
          required: false
          in: query
          description: Filtrar por ID de lote (ObjectId)
          schema:
            type: string
        - name: movementType
          required: false
          in: query
          description: Filtrar por tipo de movimiento
          schema:
            type: string
            enum:
              - in
              - out
              - waste
              - adjustment
        - name: referenceId
          required: false
          in: query
          description: Filtrar por referencia externa (orden, platillo, etc.)
          schema:
            type: string
        - name: from
          required: false
          in: query
          description: Fecha inicial (ISO 8601)
          schema:
            example: 2026-11-01T00:00:00.000Z
            type: string
        - name: to
          required: false
          in: query
          description: Fecha final (ISO 8601)
          schema:
            example: 2026-11-30T23:59:59.999Z
            type: string
      responses:
        "200":
          description: Lista paginada de movimientos obtenida con éxito
      summary: Consultar movimientos de inventario
      tags:
        - movements
  /recipes:
    post:
      operationId: RecipeController_createOrUpdate
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeDto"
      responses:
        "200":
          description: Receta existente actualizada exitosamente de forma idempotente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResponseDto"
        "201":
          description: Receta registrada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResponseDto"
        "400":
          description: Datos de entrada inválidos o incompletos
        "404":
          description: Uno o más items referenciados no existen en el catálogo
        "409":
          description: Conflicto al persistir la receta
      summary: Registrar o actualizar una receta (idempotente por plateId)
      tags: &a4
        - recipes
    get:
      operationId: RecipeController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Página (desde 1)
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Resultados por página (máximo 100)
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: available
          required: false
          in: query
          description: Filtrar por recetas disponibles (true) o no disponibles (false)
          schema:
            example: true
            type: boolean
      responses:
        "200":
          description: Lista paginada de recetas obtenida con éxito
      summary: Obtener el listado paginado de recetas con cálculo de disponibilidad y
        costo en tiempo real
      tags: *a4
  /recipes/{id}:
    get:
      operationId: RecipeController_findOne
      parameters:
        - name: id
          required: true
          in: path
          description: ID único de MongoDB (ObjectId) o plateId del platillo
          schema:
            example: PLATE-BURGER-01
            type: string
      responses:
        "200":
          description: Detalle de la receta y disponibilidad obtenido con éxito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResponseDto"
        "404":
          description: Receta no encontrada
      summary: Obtener una receta con su detalle de disponibilidad por su ID
        (ObjectId) o plateId
      tags: *a4
    patch:
      operationId: RecipeController_update
      parameters:
        - name: id
          required: true
          in: path
          description: ID único de MongoDB (ObjectId) o plateId del platillo
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipeDto"
      responses:
        "200":
          description: Receta actualizada con éxito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResponseDto"
        "404":
          description: Receta o items no encontrados
      summary: Actualizar parcialmente una receta
      tags: *a4
    delete:
      operationId: RecipeController_remove
      parameters:
        - name: id
          required: true
          in: path
          description: ID único de MongoDB (ObjectId) o plateId del platillo
          schema:
            type: string
      responses:
        "200":
          description: Receta eliminada con éxito
        "404":
          description: Receta no encontrada
      summary: Eliminar una receta
      tags: *a4
  /reservations:
    get:
      description: Permite filtrar por estado, orden o item. Las reservas pendientes
        expiradas no se incluyen.
      operationId: ReservationController_findAll
      parameters:
        - name: status
          required: false
          in: query
          description: Filtrar por estado de la reserva
          schema:
            type: string
            enum:
              - pending
              - confirmed
              - consumed
              - released
              - expired
        - name: orderId
          required: false
          in: query
          description: Filtrar por referencia externa de orden
          schema:
            type: string
        - name: itemId
          required: false
          in: query
          description: Filtrar por ID de item (ObjectId)
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Máximo de resultados a devolver
          schema:
            type: number
      responses:
        "200":
          description: Lista de reservas obtenida con éxito
      summary: Listar reservas de stock
      tags: &a5
        - reservations
  /reservations/pending/summary:
    get:
      description: Agrupa las reservas pendientes por item para conocer cuánto stock
        está apartado pero aún no confirmado.
      operationId: ReservationController_getPendingSummary
      parameters:
        - name: itemId
          required: false
          in: query
          description: Filtrar por ID de item (ObjectId)
          schema:
            type: string
      responses:
        "200":
          description: Resumen de reservas pendientes
      summary: Resumen de stock apartado pendiente
      tags: *a5
  /reservations/{orderId}:
    get:
      operationId: ReservationController_findByOrderId
      parameters:
        - name: orderId
          required: true
          in: path
          description: Referencia externa de la orden
          schema:
            type: string
      responses:
        "200":
          description: Reserva obtenida con éxito
        "404":
          description: Reserva no encontrada
      summary: Obtener la reserva de una orden
      tags: *a5
  /movements/waste:
    post:
      description: Descuenta del lote la cantidad perdida y registra el movimiento de
        merma. Solo requiere el lote, la cantidad y el motivo. Las mermas de
        órdenes llegan por evento desde Órdenes.
      operationId: WasteController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWasteDto"
      responses:
        "201":
          description: Merma registrada
        "422":
          description: La cantidad excede lo que queda en el lote
      summary: Registrar una merma de un lote
      tags:
        - movements
info:
  title: Inventory Backend
  description: "API del inventario. El acceso se realiza a través del API Gateway
    (Kong): el cliente presenta un access token Bearer HS256 y el gateway
    propaga la identidad en los headers X-User-Id, X-Staff-Id, X-User-Roles y
    X-User-Permissions."
  version: 0.0.1
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateItemDto:
      type: object
      properties:
        sku:
          type: string
          description: Código SKU del item
          example: ING-0001
        name:
          type: string
          description: Nombre del item
          example: Tomate
        description:
          type: string
          description: Descripción del item
          example: Tomate perita para salsas
        category:
          type: string
          description: Categoría del item
          example: Verduras
        unit:
          type: string
          description: Unidad de medida
          example: kg
        minStock:
          type: number
          description: Cantidad en minima para el stock
          example: 10
        isPerishable:
          type: boolean
          description: Indica si el item es perecedero
          example: true
        storageCondition:
          type: string
          description: Condición de almacenamiento
          example: Refrigerado
        averageCost:
          type: number
          description: Costo promedio por unidad de medida
          example: 18.5
        supplierIdSugested:
          type: string
          description: ID del proveedor sugerido
          example: 507f1f77bcf86cd799439011
      required:
        - sku
        - name
        - category
        - unit
        - minStock
        - storageCondition
    UpdateItemDto:
      type: object
      properties:
        sku:
          type: string
          description: Código SKU del item
          example: ING-0001
        name:
          type: string
          description: Nombre del item
          example: Tomate
        description:
          type: string
          description: Descripción del item
          example: Tomate perita para salsas
        category:
          type: string
          description: Categoría del item
          example: Verduras
        unit:
          type: string
          description: Unidad de medida
          example: kg
        minStock:
          type: number
          description: Cantidad en minima para el stock
          example: 10
        isPerishable:
          type: boolean
          description: Indica si el item es perecedero
          example: true
        storageCondition:
          type: string
          description: Condición de almacenamiento
          example: Refrigerado
        averageCost:
          type: number
          description: Costo promedio por unidad de medida
          example: 18.5
        supplierIdSugested:
          type: string
          description: ID del proveedor sugerido
          example: 507f1f77bcf86cd799439011
    CreateSupplierDto:
      type: object
      properties:
        name:
          type: string
          description: Nombre del proveedor
          example: Distribuidora Central
        contactName:
          type: string
          description: Nombre del contacto
          example: Juan Pérez
        phone:
          type: string
          description: Teléfono de contacto
          example: +52 55 1234 5678
        email:
          type: string
          description: Correo electrónico
          example: contacto@proveedor.com
        address:
          type: string
          description: Dirección
          example: Av. Reforma 123, CDMX
      required:
        - name
    UpdateSupplierDto:
      type: object
      properties:
        name:
          type: string
          description: Nombre del proveedor
          example: Distribuidora Central
        contactName:
          type: string
          description: Nombre del contacto
          example: Juan Pérez
        phone:
          type: string
          description: Teléfono de contacto
          example: +52 55 1234 5678
        email:
          type: string
          description: Correo electrónico
          example: contacto@proveedor.com
        address:
          type: string
          description: Dirección
          example: Av. Reforma 123, CDMX
    CreateBatchDto:
      type: object
      properties:
        batchNumber:
          type: string
          description: Número de lote (se combina con el SKU del item; si se omite, se
            genera automáticamente)
          example: LOTE-2026-001
        itemId:
          type: string
          description: ID del item (ObjectId)
          example: 60d5ec...
        quantity:
          type: number
          description: Cantidad del lote
          example: 100
        expirationDate:
          type: string
          description: Fecha de expiración
          example: 2026-12-31T23:59:59Z
        supplierId:
          type: string
          description: ID del proveedor (ObjectId)
          example: 60d5ec...
        cost:
          type: number
          description: Costo unitario del lote
          example: 150.5
      required:
        - itemId
        - quantity
        - expirationDate
        - cost
    UpdateBatchDto:
      type: object
      properties:
        quantity:
          type: number
          description: Cantidad del lote
          example: 100
        expirationDate:
          type: string
          description: Fecha de expiración
          example: 2026-12-31T23:59:59Z
        cost:
          type: number
          description: Costo unitario del lote
          example: 150.5
        reason:
          type: string
          description: Motivo del ajuste de cantidad (solo se usa para auditoría)
          example: Corrección por conteo físico
        createdBy:
          type: string
          description: Usuario responsable del ajuste (solo se usa para auditoría)
          example: system
    CreateRecipeItemDto:
      type: object
      properties:
        itemId:
          type: string
          description: ID del item (ObjectId)
          example: 60d5ec9af682fbd39a1b865b
        requiredQuantity:
          type: number
          description: Cantidad requerida del item
          example: 0.25
          minimum: 0.0001
      required:
        - itemId
        - requiredQuantity
    CreateRecipeDto:
      type: object
      properties:
        plateId:
          type: string
          description: Identificador único del platillo
          example: PLATE-BURGER-01
        name:
          type: string
          description: Nombre del platillo o receta
          example: Hamburguesa clásica
        items:
          description: Lista de items e insumos necesarios para la receta
          type: array
          items:
            $ref: "#/components/schemas/CreateRecipeItemDto"
      required:
        - plateId
        - name
        - items
    RecipeItemDetailResponseDto:
      type: object
      properties:
        itemId:
          type: string
          description: ID del item
          example: 60d5ec9af682fbd39a1b865b
        itemName:
          type: string
          description: Nombre del item
          example: Carne de res molida
        unit:
          type: string
          description: Unidad de medida
          example: kg
        requiredQuantity:
          type: number
          description: Cantidad requerida para una porción de la receta
          example: 0.2
        availableStock:
          type: number
          description: Stock actual disponible en inventario
          example: 5
        hasSufficientStock:
          type: boolean
          description: Indica si existe suficiente stock para al menos una porción
          example: true
      required:
        - itemId
        - itemName
        - unit
        - requiredQuantity
        - availableStock
        - hasSufficientStock
    RecipeResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID único de la receta en MongoDB (ObjectId)
          example: 60d5ec9af682fbd39a1b865c
        plateId:
          type: string
          description: Identificador único del platillo
          example: PLATE-BURGER-01
        name:
          type: string
          description: Nombre del platillo o receta
          example: Hamburguesa clásica
        isAvailable:
          type: boolean
          description: Indica si la receta está disponible según las existencias de todos
            sus insumos
          example: true
        maxPreparablePortions:
          type: number
          description: Número máximo de porciones que se pueden preparar con el stock actual
          example: 25
        productionCost:
          type: number
          description: Costo total estimado de producción por porción según costo unitario
            de items
          example: 45.5
        items:
          description: Lista detallada de items requeridos y su disponibilidad
          type: array
          items:
            $ref: "#/components/schemas/RecipeItemDetailResponseDto"
        isComplete:
          type: boolean
          description: false cuando la receta referencia insumos que no existen en el
            catálogo
          example: true
        missingItemIds:
          description: IDs de insumos referenciados que no existen en el catálogo
          example: []
          type: array
          items:
            type: string
        createdAt:
          format: date-time
          type: string
          description: Fecha de creación del registro
        updatedAt:
          format: date-time
          type: string
          description: Fecha de última actualización del registro
      required:
        - id
        - plateId
        - name
        - isAvailable
        - maxPreparablePortions
        - productionCost
        - items
        - isComplete
        - missingItemIds
    UpdateRecipeDto:
      type: object
      properties:
        plateId:
          type: string
          description: Identificador único del platillo
          example: PLATE-BURGER-01
        name:
          type: string
          description: Nombre del platillo o receta
          example: Hamburguesa clásica
        items:
          description: Lista de items e insumos necesarios para la receta
          type: array
          items:
            $ref: "#/components/schemas/CreateRecipeItemDto"
    CreateWasteDto:
      type: object
      properties:
        batchId:
          type: string
          description: Lote en el que se generó la merma
          example: 60d5ec9af682fbd39a1b865b
        quantity:
          type: number
          description: Cantidad perdida
          example: 0.5
        reason:
          type: string
          description: Motivo de la merma
          example: Se cayó durante el acomodo del almacén
      required:
        - batchId
        - quantity
        - reason
security:
  - bearer: []
